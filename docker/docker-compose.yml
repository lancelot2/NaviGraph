# Full NaviGraph self-host: the web app + a local Supabase (Postgres/pgvector,
# Auth, PostgREST, Storage) behind one gateway. Boots with no OpenAI key.
#
#   cd docker && cp .env.example .env && docker compose up
#   app:      http://localhost:3000
#   supabase: http://localhost:8000   (NEXT_PUBLIC_SUPABASE_URL)
#
# Modeled on Supabase's official self-hosting stack, trimmed to the services the
# app uses. Uses the public demo credentials in .env.example — change them for
# anything exposed to a network.

name: navigraph

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.176.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      # No SMTP in the box: auto-confirm sign-ups so local login works.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v1.19.3
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  # One-shot: waits until Auth and Storage have created their schemas, then
  # applies the NaviGraph migrations (tables, RLS, RPCs, buckets).
  migrate:
    image: supabase/postgres:15.8.1.085
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "Waiting for auth.users and storage.buckets…"
        until [ "$$(psql -h db -U postgres -d postgres -tAc "select (to_regclass('auth.users') is not null) and (to_regclass('storage.buckets') is not null)")" = "t" ]; do
          sleep 2
        done
        echo "Applying NaviGraph migrations…"
        for f in /migrations/*.sql; do
          echo "  -> $$f"
          psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations applied."
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    depends_on:
      gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      VISION_PROVIDER: ${VISION_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # So server-side code in the container reaches the gateway at the same
    # localhost:8000 URL the browser uses.
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3000:3000"

volumes:
  db-data:
  storage-data:
