# Minimal Supabase API gateway: multiplexes the auth / rest / storage services
# under one origin so supabase-js (NEXT_PUBLIC_SUPABASE_URL) can reach them all.
# A leaner alternative to Kong for self-hosting; not a substitute for a hardened
# production gateway.

events {}

http {
  # Uploaded floor plans / photos can be large.
  client_max_body_size 50m;

  server {
    listen 80;

    # GoTrue (auth): supabase-js calls /auth/v1/*  ->  service root.
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PostgREST (database + RPC): /rest/v1/*  ->  service root.
    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Storage: /storage/v1/*  ->  service root.
    location /storage/v1/ {
      proxy_pass http://storage:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
