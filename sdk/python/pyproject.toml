[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navigraph"
version = "0.1.0"
description = "Offline-first spatial navigation context for robots — hosted and offline backends over one interface."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lancelot Salavert" }]
keywords = ["robotics", "navigation", "ros2", "spatial", "offline", "clip", "dinov2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core (hosted client, offline planning + context, zero-vision) is
# standard-library only. Localization backends are optional extras.
dependencies = []

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16", "numpy>=1.21", "pillow>=9"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/lancelot2/spatial-context-engine"
Repository = "https://github.com/lancelot2/spatial-context-engine"
"Bundle format" = "https://github.com/lancelot2/spatial-context-engine/blob/main/docs/spatial-graph-format.md"

[tool.hatch.build.targets.wheel]
packages = ["navigraph"]

[tool.hatch.build.targets.sdist]
include = ["navigraph", "README.md", "LICENSE", "tests"]
