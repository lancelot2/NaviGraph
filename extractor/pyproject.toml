[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navigraph-extractor"
version = "0.1.0"
description = "Deterministic floor-plan geometry extraction (regions, passages, graph) with LLM labeling — FloorPlan2Nav-style, geometry decoupled from semantics."
readme = "README.md"
requires-python = ">=3.10"
# Classic table form (not the SPDX string) for old-pip build compatibility.
license = { text = "Apache-2.0" }
authors = [{ name = "NaviGraph contributors" }]
keywords = ["floor-plan", "opencv", "robotics", "navigation", "graph", "segmentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
# The geometry core is CV-only; no network. The LLM layer and the HTTP service
# are behind extras.
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "pydantic>=2",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/lancelot2/NaviGraph"

[tool.hatch.build.targets.wheel]
packages = ["navigraph_extractor"]
